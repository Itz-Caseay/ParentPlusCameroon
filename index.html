<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent+ Cameroon</title>
    <meta
      name="description"
      content="Parent+ Cameroon - Digital Positive Parenting Support Platform"
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <!-- <link rel="stylesheet" href="./styles.css"> -->
    <style>
      :root {
        /* --- Parent+ Cameroon palette (light) --- */
        --background: #fbf7f0;
        --foreground: #17352d;
        --card: #fffdf9;
        --primary: #d26a4b;
        --primary-2: #c05a3c;
        --secondary: #e3efe7;
        --muted: #f1e8da;
        --muted-foreground: #8a7e72;
        --accent: #f5d8bf;
        --border: #e6dacb;

        /* --- legacy aliases used across the stylesheet --- */
        --bg: var(--background);
        --ink: var(--foreground);
        --panel: var(--card);
        --line: var(--border);
        --green: var(--primary);
        --green-2: var(--primary-2);
        --green-soft: var(--secondary);
        --primary-soft: var(--accent);
        --pill: var(--muted);
        --track: var(--muted);

        /* --- semantic colors (not part of the core palette) --- */
        --yellow: #d4a853;
        --yellow-soft: #fbf3e0;
        --blue: #5d8bbf;
        --red: #c45d5d;

        --shadow: 0 12px 35px rgba(23, 53, 45, 0.09);
        --radius: 18px;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        /* --- Parent+ Cameroon palette (dark) --- */
        --background: #17231f;
        --foreground: #f5eee4;
        --card: #21312b;
        --primary: #ef9270;
        --primary-2: #f0a485;
        --secondary: #2d443a;
        --muted: #293a33;
        --muted-foreground: #9a8e82;
        --accent: #604638;
        --border: #3a4e45;

        /* --- legacy aliases used across the stylesheet --- */
        --bg: var(--background);
        --ink: var(--foreground);
        --panel: var(--card);
        --line: var(--border);
        --green: var(--primary);
        --green-2: var(--primary-2);
        --green-soft: var(--secondary);
        --primary-soft: var(--accent);
        --pill: var(--muted);
        --track: var(--muted);

        /* --- semantic colors (not part of the core palette) --- */
        --yellow: #d4a853;
        --yellow-soft: #2e2616;
        --blue: #7ba3c9;
        --red: #e07a7a;

        --shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      .topbar {
        height: 72px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5%;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        text-decoration: none;
        color: var(--ink);
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        color: #fff;
        font-weight: 900;
        font-size: 20px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .brand small {
        display: block;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .topbar nav {
        display: flex;
        gap: 4px;
      }
      .topbar nav button,
      .ghost {
        background: transparent;
        color: var(--ink);
        padding: 9px 12px;
        border-radius: 10px;
      }
      .topbar nav button:hover,
      .ghost:hover {
        background: var(--green-soft);
      }
      .primary {
        background: var(--primary);
        color: #fff;
        padding: 12px 18px;
        border-radius: 11px;
        font-weight: 700;
      }
      .primary:hover {
        background: var(--primary-2);
      }
      .small {
        padding: 9px 14px;
      }
      .danger {
        background: var(--red);
        color: #fff;
        padding: 12px 18px;
        border-radius: 11px;
        font-weight: 700;
      }
      .danger:hover {
        opacity: 0.85;
      }
      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-left: auto;
      }
      @media (min-width: 651px) {
        .topbar {
          position: relative;
        }
        .topbar nav {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
        }
        .topbar nav button .iconic {
          display: none;
        }
      }
      #langBtn,
      #themeBtn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        font-weight: 700;
      }

      .hero {
        padding: 70px 5% 55px;
        background: linear-gradient(
          135deg,
          var(--green-soft) 0%,
          var(--card) 58%,
          var(--yellow-soft) 100%
        );
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 45px;
        align-items: center;
      }
      .eyebrow {
        display: inline-flex;
        background: var(--green-soft);
        color: var(--green);
        padding: 7px 11px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 800;
      }
      h1 {
        font-size: clamp(38px, 5vw, 66px);
        line-height: 1.03;
        margin: 16px 0;
      }
      h2 {
        font-size: 32px;
        margin: 0 0 10px;
      }
      h3 {
        margin: 0 0 8px;
      }
      .lead {
        font-size: 18px;
        color: var(--muted-foreground);
        max-width: 680px;
      }
      .hero-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
        flex-wrap: wrap;
      }
      .secondary {
        background: var(--secondary);
        border: 1px solid var(--border);
        padding: 12px 18px;
        border-radius: 11px;
        font-weight: 700;
      }
      .hero-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 26px;
        box-shadow: var(--shadow);
      }
      .family-illustration {
        height: 260px;
        border-radius: 22px;
        background: linear-gradient(
          145deg,
          var(--green-soft),
          var(--yellow-soft)
        );
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .family-illustration img {
        max-width: 60%;
        max-height: 80%;
        object-fit: contain;
        border-radius: 22px;
      }
      .mini-stat {
        display: flex;
        justify-content: space-between;
        padding-top: 16px;
        margin-top: 16px;
        border-top: 1px solid var(--line);
      }

      .section {
        padding: 55px 5%;
        max-width: 1250px;
        margin: auto;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: end;
        margin-bottom: 25px;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 22px;
        box-shadow: 0 5px 20px rgba(23, 53, 45, 0.04);
      }
      .icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        font-size: 22px;
        margin-bottom: 15px;
      }
      .icon svg {
        display: block;
      }
      .card p {
        color: var(--muted-foreground);
        margin-bottom: 0;
      }
      .feature-number {
        font-size: 30px;
        font-weight: 900;
        color: var(--green);
      }
      .pill {
        display: inline-block;
        border-radius: 99px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 800;
        background: var(--pill);
        color: var(--muted-foreground);
      }
      .progress {
        height: 8px;
        background: var(--track);
        border-radius: 99px;
        overflow: hidden;
        margin: 12px 0;
      }
      .progress > span {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: 99px;
      }
      .course {
        display: flex;
        flex-direction: column;
      }
      .course .course-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .course .course-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        flex-shrink: 0;
      }
      .course .course-icon svg {
        display: block;
      }
      .course button {
        margin-top: 18px;
      }
      .callout {
        background: var(--green);
        color: #fff;
        border-radius: 24px;
        padding: 30px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }
      .callout p {
        opacity: 0.85;
        margin: 5px 0 0;
      }
      .callout .secondary {
        color: var(--primary);
      }

      .dashboard {
        padding: 35px 5%;
        max-width: 1250px;
        margin: auto;
      }
      .dashboard-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        margin-bottom: 25px;
      }
      .dashboard-header h1 {
        font-size: clamp(22px, 3.5vw, 30px);
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 18px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .kpi strong {
        font-size: 28px;
        display: block;
      }
      .kpi span {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .lesson-list {
        display: grid;
        gap: 12px;
      }
      .lesson-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }
      .lesson-row .status {
        margin-left: auto;
      }
      .check {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 900;
        flex-shrink: 0;
      }
      .check svg {
        display: block;
      }

      .form-card {
        max-width: 560px;
        margin: 50px auto;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        font-weight: 700;
        font-size: 14px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--secondary);
        color: var(--foreground);
        padding: 12px 13px;
        border-radius: 10px;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .choice {
        border: 1px solid var(--border);
        padding: 15px;
        border-radius: 12px;
        background: var(--secondary);
        text-align: left;
      }
      .choice.active {
        border: 2px solid var(--primary);
        background: var(--primary-soft);
      }

      .onboarding-options {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }
      .onboarding-option {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--panel);
        cursor: pointer;
        transition: 0.15s;
      }
      .onboarding-option:hover {
        border-color: var(--primary);
      }
      .onboarding-option.active {
        border: 2px solid var(--primary);
        background: var(--primary-soft);
      }
      .onboarding-option input[type="checkbox"] {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
        flex-shrink: 0;
      }
      .onboarding-option-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: var(--green-soft);
        color: var(--green);
      }
      .onboarding-option-icon svg {
        display: block;
      }
      .onboarding-option.active .onboarding-option-icon {
        background: var(--primary);
        color: #fff;
      }
      .onboarding-option-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .onboarding-option-text strong {
        color: var(--ink);
        font-size: 15px;
      }
      .onboarding-option-text .muted {
        font-size: 13px;
      }
      #onboardingOtherWrap textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        resize: vertical;
      }

      .lesson-content {
        max-width: 850px;
        margin: 35px auto;
      }
      .lesson-content .card {
        margin-bottom: 16px;
      }
      .lesson-hero {
        background: linear-gradient(135deg, var(--green-soft), var(--panel));
        padding: 28px;
        border-radius: 22px;
        margin-bottom: 18px;
      }
      .view-compact h1 {
        font-size: 30px;
        line-height: 1.15;
      }
      .view-compact h2 {
        font-size: 20px;
      }
      .tip {
        border-left: 4px solid var(--yellow);
        background: var(--yellow-soft);
        padding: 15px 17px;
        border-radius: 8px;
      }
      .quiz-option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel);
        margin: 8px 0;
      }
      .quiz-option.correct {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .quiz-option.wrong {
        border-color: var(--red);
        background: var(--yellow-soft);
      }
      .quiz-result {
        font-weight: 700;
        font-size: 14px;
        margin-top: 8px;
      }
      .quiz-result.correct {
        color: var(--primary);
      }
      .quiz-result.wrong {
        color: var(--red);
      }

      .community-post {
        display: grid;
        gap: 10px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 900;
        flex-shrink: 0;
      }
      .avatar svg {
        display: block;
      }
      .post-head {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .auth-note {
        font-size: 13px;
        color: var(--foreground);
        text-align: center;
      }
      .alert {
        padding: 13px 15px;
        border-radius: 11px;
        background: var(--yellow-soft);
        color: var(--ink);
      }
      .success {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .form-msg {
        font-weight: 700;
        font-size: 14px;
        margin: 0;
      }
      .form-msg.error {
        color: var(--red);
      }
      .form-msg.success {
        color: var(--primary);
      }
      .completion-msg {
        font-weight: 700;
        margin-top: 12px;
      }
      .completion-msg.error {
        color: var(--red);
      }
      footer {
        padding: 30px 5%;
        background: var(--ink);
        color: var(--card);
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .footer-links {
        display: flex;
        gap: 20px;
        color: var(--muted-foreground);
        font-size: 13px;
        flex-wrap: wrap;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: var(--ink);
        color: var(--card);
        padding: 13px 16px;
        border-radius: 11px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: 0.25s;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .grid-3,
        .grid-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 650px) {
        .topbar {
          padding: 0 4%;
          height: auto;
          min-height: 65px;
          flex-wrap: wrap;
          padding-top: 9px;
          padding-bottom: 9px;
        }
        .topbar nav {
          order: 3;
          width: 100%;
          overflow: auto;
          justify-content: center;
          gap: 6px;
        }
        .topbar nav button {
          white-space: nowrap;
          font-size: 12px;
          padding: 8px 14px;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2px;
          flex: 0 1 auto;
        }
        .topbar nav button .nav-label {
          display: none;
          font-size: 10px;
        }
        .topbar nav button:active .nav-label,
        .topbar nav button.touched .nav-label {
          display: inline;
        }
        .top-actions {
          margin-left: auto;
        }
        .hero {
          padding: 45px 4%;
        }
        .section,
        .dashboard {
          padding-left: 4%;
          padding-right: 4%;
        }
        .lesson-content {
          padding: 0 4%;
        }
        .profile-row {
          flex-direction: column;
          align-items: flex-start;
        }
        .profile-row strong {
          white-space: nowrap;
          text-align: left;
        }
        .grid-3,
        .grid-4,
        .kpis,
        .choice-grid {
          grid-template-columns: 1fr;
        }
        .dashboard-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .section-head {
          flex-direction: column;
          align-items: flex-start;
        }
        h1 {
          font-size: 42px;
        }
        footer {
          flex-direction: column;
        }
        .callout {
          flex-direction: column;
          align-items: start;
        }
      }

      :root[data-theme="dark"] .hero {
        background: linear-gradient(
          135deg,
          var(--bg) 0%,
          var(--card) 55%,
          var(--yellow-soft) 100%
        );
      }
      :root[data-theme="dark"] .alert {
        color: var(--yellow);
      }
      :root[data-theme="dark"] .callout {
        background: var(--panel);
      }
      :root[data-theme="dark"] .toast {
        background: var(--card);
      }
      :root[data-theme="dark"] .brand small {
        color: var(--muted-foreground);
      }
      :root[data-theme="dark"] input::placeholder,
      :root[data-theme="dark"] textarea::placeholder {
        color: var(--muted-foreground);
      }
      :root[data-theme="dark"] .quiz-option.wrong {
        background: var(--yellow-soft);
      }

      body.logged-in .topbar nav {
        display: none;
      }
      @media (min-width: 901px) {
        body.logged-in .brand {
          display: none;
        }
      }
      .layout {
        display: flex;
        align-items: flex-start;
      }
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--card);
        border-right: 1px solid var(--line);
        padding: 20px 14px;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 21;
        overflow: auto;
      }
      .side-brand {
        display: flex;
        gap: 10px;
        align-items: center;
        text-decoration: none;
        color: var(--ink);
        margin-bottom: 22px;
        padding: 0 4px;
      }
      .side-nav {
        display: grid;
        gap: 6px;
      }
      .side-nav button {
        text-align: left;
        background: transparent;
        border: 0;
        color: var(--ink);
        padding: 12px 14px;
        border-radius: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .side-nav button:hover {
        background: var(--green-soft);
      }
      .side-nav button.active {
        background: var(--green);
        color: #fff;
      }
      .content {
        flex: 1;
        min-width: 0;
        padding-bottom: 60px;
        margin-left: 240px;
      }
      .avatar-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        display: grid;
        place-items: center;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .avatar-lg {
        width: 76px;
        height: 76px;
        font-size: 28px;
        margin: 0 auto 16px;
      }
      .profile-card {
        text-align: center;
      }
      .profile-info {

      a {

      .iconic[data-icon="heart-plus"] {
        -webkit-mask-image: url("icons/heart-plus (1).svg");

      .iconic[data-icon="newspaper"] {
        -webkit-mask-image: url("icons/newspaper (1).svg");
        mask-image: url("icons/newspaper (1).svg");
      }
      .iconic[data-icon="user-round"] {
        -webkit-mask-image: url("icons/user-round (1).svg");

      .iconic[data-icon="log-out"] {

      .iconic[data-icon="chevron-left"] {
        -webkit-mask-image: url("icons/chevron-left (1).svg");
        mask-image: url("icons/chevron-left (1).svg");
      }
      .iconic[data-icon="eye"] {
        -webkit-mask-image: url("icons/eye (1).svg");
        mask-image: url("icons/eye (1).svg");
      }
      .iconic[data-icon="eye-off"] {
        -webkit-mask-image: url("icons/eye-off (1).svg");
        mask-image: url("icons/eye-off (1).svg");
      }
      .iconic[data-icon="bell"] {
        -webkit-mask-image: url("icons/bell.svg");

      }
      .iconic[data-icon="lock-keyhole"] {
        -webkit-mask-image: url("icons/lock-keyhole.svg");

      }
      .iconic[data-icon="globe"] {
        -webkit-mask-image: url("icons/globe.svg");

      }
      .iconic[data-icon="palette"] {
        -webkit-mask-image: url("icons/palette.svg");

      }
      .iconic[data-icon="settings"] {
        -webkit-mask-image: url("icons/settings.svg");

      }
      .iconic[data-icon="volume"] {
        -webkit-mask-image: url("icons/volume.svg");

      }
      .iconic[data-icon="square-text"] {
        -webkit-mask-image: url("icons/square-text.svg");
        mask-image: url("icons/square-text.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="theme"] {
        -webkit-mask-image: url("icons/sun.svg");
        mask-image: url("icons/sun.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="house"] {
        -webkit-mask-image: url("icons/house.svg");
        mask-image: url("icons/house.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="gauge"] {
        -webkit-mask-image: url("icons/gauge.svg");
        mask-image: url("icons/gauge.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="library-big"] {
        -webkit-mask-image: url("icons/library-big.svg");
        mask-image: url("icons/library-big.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="heart-plus"] {
        -webkit-mask-image: url("icons/heart-plus.svg");
        mask-image: url("icons/heart-plus.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="newspaper"] {
        -webkit-mask-image: url("icons/newspaper.svg");
        mask-image: url("icons/newspaper.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="user-round"] {
        -webkit-mask-image: url("icons/user-round.svg");
        mask-image: url("icons/user-round.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="log-out"] {
        -webkit-mask-image: url("icons/log-out.svg");
        mask-image: url("icons/log-out.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="chevron-left"] {
        -webkit-mask-image: url("icons/chevron-left.svg");
        mask-image: url("icons/chevron-left.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="eye"] {
        -webkit-mask-image: url("icons/eye.svg");
        mask-image: url("icons/eye.svg");
      }
      :root[data-theme="dark"] .iconic[data-icon="eye-off"] {
        -webkit-mask-image: url("icons/eye-off.svg");

      .topbar nav button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .side-nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .btn-with-icon {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .secondary.small.btn-with-icon {
        padding: 6px 10px;
        font-size: 12px;
      }
      .danger.btn-with-icon {
        padding: 9px 14px;
        font-size: 13px;
      }
      .password-wrap {
        position: relative;
      }
      .password-wrap input {
        padding-right: 46px;
      }
      .eye-toggle {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: 0;
        color: var(--muted-foreground);
        padding: 8px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .eye-toggle:hover {
        color: var(--ink);
      }

      @media (max-width: 900px) {
        .side-nav button {
          flex-direction: column;
          gap: 2px;
        }
      }

      @media (max-width: 480px) {
        .topbar nav button {
          font-size: 11px;
          padding: 7px 6px;
        }
        .top-actions {
          gap: 4px;
        }
        .brand {
          gap: 7px;
        }
        .brand-mark {
          width: 36px;
          height: 36px;
          font-size: 17px;
        }
        .dashboard,
        .section {
          padding-left: 4%;
          padding-right: 4%;
        }
        .form-card {
          margin: 28px auto;
        }
        .mini-stat {
          flex-direction: column;
          gap: 2px;
        }
        .lesson-row {
          flex-wrap: wrap;
        }
      }

      /* === NEW COMPONENT STYLES === */

      /* Academy Filters */
      .academy-filters {
        margin-bottom: 25px;
      }
      .filter-group {
        margin-bottom: 14px;
      }
      .filter-group:last-child {
        margin-bottom: 0;
      }
      .filter-label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 8px;
        color: var(--ink);
      }
      .filter-select {
        width: 100%;
        max-width: 300px;
      }
      .filter-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-pill {
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid var(--border);
      }
      .filter-pill.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .recommended-section {
        margin-bottom: 30px;
      }
      .recommended-section h3 {
        font-size: 20px;
        margin-bottom: 14px;
      }

      /* Lesson extras (audio, offline) */
      .lesson-extras {
        display: flex;
        gap: 10px;
        margin: 16px 0;
        flex-wrap: wrap;
      }

      /* Notification Bell */
      .notif-bell {
        position: relative;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: transparent;
        color: var(--ink);
        border: 0;
        cursor: pointer;
      }
      .notif-bell:hover {
        background: var(--green-soft);
      }
      .notif-bell .iconic {
        width: 22px;
        height: 22px;
      }
      .notif-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        min-width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--red);
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        padding: 0 4px;
      }

      /* Notifications Page */
      .notifications-list {
        display: grid;
        gap: 10px;
      }
      .notification-card {
        display: flex;
        gap: 14px;
        align-items: start;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        cursor: pointer;
        transition: 0.2s;
      }
      .notification-card:hover {
        border-color: var(--green);
      }
      .notification-card.unread {
        border-left: 3px solid var(--green);
        background: var(--green-soft);
      }
      .notification-card.read {
        opacity: 0.7;
      }
      .notif-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        flex-shrink: 0;
      }
      .notif-icon svg {
        display: block;
      }
      .notif-content {
        flex: 1;
      }
      .notif-content strong {
        display: block;
        margin-bottom: 4px;
      }
      .notif-content p {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 0;
      }
      .notif-time {
        font-size: 12px;
        color: var(--muted-foreground);
        margin-top: 6px;
        display: block;
      }

      /* Profile Sections */
      .profile-section {
        margin: 20px 0;
        padding: 16px 0;
        border-top: 1px solid var(--line);
        text-align: left;
      }
      .profile-section:first-of-type {
        border-top: none;
      }
      .profile-section h3 {
        font-size: 18px;
        margin-bottom: 12px;
      }

      /* Profile Child Row */
      .profile-child-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 8px;
        background: var(--panel);
      }
      .profile-child-row.selected {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .profile-child-info {
        display: flex;
        flex-direction: column;
      }
      .profile-child-info .muted {
        font-size: 13px;
      }
      .profile-child-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .danger-small {
        color: var(--red);
        font-weight: 700;
        background: transparent;
        border: 1px solid var(--red);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
      }
      .danger-small:hover {
        background: var(--red);
        color: #fff;
      }

      /* Rewards / Badges */
      .rewards-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .rewards-points {
        font-size: 18px;
        font-weight: 800;
      }
      .rewards-badges {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .badges-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .badge-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 16px 10px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        gap: 4px;
      }
      .badge-card.unlocked {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .badge-card.locked {
        opacity: 0.5;
      }
      .badge-icon {
        font-size: 32px;
      }
      .badge-lock {
        font-size: 11px;
        color: var(--muted-foreground);
        font-weight: 700;
      }
      .profile-stars {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin: 12px 0;
        color: var(--yellow, #e8a33d);
      }
      .profile-stars svg {
        display: block;
      }
      .onboarding-thanks-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        margin: 0 auto 16px;
      }
      .onboarding-thanks-icon svg {
        width: 32px;
        height: 32px;
        display: block;
      }
      .inline-icon {
        display: inline-grid;
        place-items: center;
        vertical-align: -6px;
      }
      .inline-icon svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .lesson-title-icon {
        display: inline-grid;
        place-items: center;
        vertical-align: -8px;
        color: var(--green);
      }
      .lesson-title-icon svg {
        display: block;
        width: 28px;
        height: 28px;
      }

      /* Community Tabs */
      .community-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--line);
        padding-bottom: 0;
        flex-wrap: wrap;
      }
      .community-tab {
        padding: 10px 16px;
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        border-radius: 8px 8px 0 0;
      }
      .community-tab.active {
        color: var(--green);
        border-bottom-color: var(--green);
        background: var(--green-soft);
      }
      .community-tab:hover {
        background: var(--green-soft);
      }

      /* Situation Cards (Support) */
      .situation-card {
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
      }
      .situation-card:hover {
        border-color: var(--green);
        transform: translateY(-2px);
      }
      .situation-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        margin: 0 auto 10px;
      }
      .situation-icon svg {
        display: block;
        width: 26px;
        height: 26px;
      }

      /* Settings */
      .settings-section {
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      .settings-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
      }
      .settings-section h3 {
        font-size: 16px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted-foreground);
      }
      .settings-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        background: var(--panel);
        font-weight: 600;
        font-size: 14px;
      }
      .settings-item:hover {
        border-color: var(--green);
      }
      .settings-sub-item {
        padding: 8px 12px 8px 28px;
        font-size: 13px;
      }
      .settings-sub-item label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 400;
        cursor: pointer;
      }
      .settings-sub-item input[type="checkbox"] {
        width: auto;
        cursor: pointer;
      }

      /* Toggle Switch */
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
        cursor: pointer;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        inset: 0;
        background: var(--border);
        border-radius: 24px;
        transition: 0.3s;
      }
      .toggle-slider::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: 0.3s;
      }
      .toggle-switch input:checked + .toggle-slider {
        background: var(--primary);
      }
      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(20px);
      }

      /* KPIs grid - 4 columns for dashboard */
      @media (min-width: 901px) {
        .kpis {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Badges grid responsive */
      @media (max-width: 650px) {
        .badges-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .profile-child-row {
          flex-direction: column;
          align-items: flex-start;
        }
        .community-tabs {
          gap: 4px;
        }
        .community-tab {
          padding: 8px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Parent+ Cameroon home">
        <span class="brand-mark"
          ><img src="assets/logo.png" alt="Parent+ Cameroon logo"
        /></span>
        <span><strong>Parent+</strong><small>Cameroon</small></span>
      </a>
      <nav>
        <button type="button" data-view="home" data-i18n="navHome">
          <span class="iconic" data-icon="house"></span
          ><span class="nav-label">Home</span>
        </button>
        <button type="button" data-view="academy" data-i18n="navAcademy">
          <span class="iconic" data-icon="library-big"></span
          ><span class="nav-label">Academy</span>
        </button>
        <button type="button" data-view="support" data-i18n="navSupport">
          <span class="iconic" data-icon="heart-plus"></span
          ><span class="nav-label">Support</span>
        </button>
        <button type="button" data-view="community" data-i18n="navCommunity">
          <span class="iconic" data-icon="newspaper"></span
          ><span class="nav-label">Community</span>
        </button>
      </nav>
      <div class="top-actions">
        <button id="langBtn" class="ghost" aria-label="Toggle language">
          FR
        </button>
        <button
          id="themeBtn"
          type="button"
          class="ghost"
          aria-label="Toggle dark mode"
        >
          <span class="iconic" data-icon="theme"></span>
        </button>
        <button
          id="notifBtn"
          type="button"
          class="notif-bell"
          aria-label="Notifications"
        >
          <span class="iconic" data-icon="bell"></span
          ><span id="notifBadge" class="notif-badge">0</span>
        </button>
        <button id="loginBtn" class="primary small">Get Started</button>
      </div>
    </header>

    <main id="app"></main>

    <footer id="siteFooter">
      <div>
        <strong>Parent+ Cameroon</strong><br /><span
          id="footerTagline"
          data-i18n="footerTagline"
          >Empowering Parents. Strengthening Families. Building Better
          Futures.</span
        >
      </div>
      <div class="footer-links">
        <span data-i18n="lowData">Low-data friendly</span>
        <span data-i18n="langs">English / French</span>
        <span data-i18n="privacy">Privacy & Safeguarding</span>
      </div>
    </footer>

    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
